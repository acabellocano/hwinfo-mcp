[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hwinfo-mcp"
version = "0.1.1"
description = "MCP server exposing HWiNFO reports and live sensor data to MCP clients on Windows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "David Morgenstern" }]
dependencies = [
    "mcp>=1.2.0,<2",
]

[project.urls]
Homepage = "https://github.com/acabellocano/hwinfo-mcp"
Issues = "https://github.com/acabellocano/hwinfo-mcp/issues"

[project.optional-dependencies]
# Only needed if you want to build a standalone single-file .exe to copy around.
build = ["pyinstaller>=6.0"]

[project.scripts]
hwinfo-mcp = "hwinfo_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hwinfo_mcp"]
